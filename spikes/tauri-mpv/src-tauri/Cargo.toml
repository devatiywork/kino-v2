[package]
name = "kino-spike-mpv"
version = "0.1.0"
edition = "2021"
publish = false
description = "Spike: libmpv in a child HWND under a transparent WebView2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libmpv2 = "5"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
