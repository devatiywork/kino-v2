[package]
name = "kino-desktop"
version = "0.28.0"
edition = "2021"
publish = false
description = "Kino — video player and torrent client (Tauri core)"

[lib]
name = "kino_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: a second webview in the main window (the trackers browser); tray-icon: Kino in the tray (SPEC 4.6)
tauri = { version = "2", features = ["protocol-asset", "unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
# «Скачан» as a Windows notification (SPEC 4.6)
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libmpv2 = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
# Torrent engine (SPEC 4): TLS for HTTP trackers through Windows' own schannel
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
anyhow = "1"
# «Блокировать рекламу» in the trackers browser: Brave's engine for EasyList-style lists
# (without single-thread: the engine is shared with WebView2's handlers)
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
# «Проверять обновления»: GitHub Releases, over the same HTTP client and TLS the torrent engine uses
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "json"] }
bytes = "1"
# The archive's backup: each .torrent inside the JSON file (the version already in the tree)
base64 = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# The trackers browser's history (back / forward): WebView2 itself, the versions wry is built on
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.61", features = [
  # Media keys: Windows' media session (System Media Transport Controls)
  "Foundation",
  "Media",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  # Explorer through the shell (shell.rs)
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

# librqbit 9.0.1 with protocol encryption (MSE/PE), which upstream lacks: crates/librqbit/KINO.md.
# A member, so that its own tests run: cargo test -p librqbit mse
[workspace]
members = ["crates/librqbit"]

[patch.crates-io]
librqbit = { path = "crates/librqbit" }
