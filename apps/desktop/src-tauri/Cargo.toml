[package]
name = "kino-desktop"
version = "0.16.0"
edition = "2021"
publish = false
description = "Kino — video player and torrent client (Tauri core)"

[lib]
name = "kino_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: a second webview in the main window (the trackers browser)
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libmpv2 = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
# Torrent engine (SPEC 4): TLS for HTTP trackers through Windows' own schannel
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
anyhow = "1"
bytes = "1"
# The archive's backup: each .torrent inside the JSON file (the version already in the tree)
base64 = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# The trackers browser's history (back / forward): WebView2 itself, the versions wry is built on
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
