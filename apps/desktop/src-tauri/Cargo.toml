[package]
name = "kino-desktop"
version = "0.12.0"
edition = "2021"
publish = false
description = "Kino — video player and torrent client (Tauri core)"

[lib]
name = "kino_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libmpv2 = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
# Torrent engine (SPEC 4): TLS for HTTP trackers through Windows' own schannel
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
anyhow = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
